apiVersion: apps/v1
kind: Deployment

metadata:
  name: home-frontend-service
  namespace: dev

spec:
  minReadySeconds: 3
  replicas: 1

  selector:
    matchLabels:
      app: home-frontend-service-app
  
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  
  template:
    metadata:
      name: home-frontend-service-pod
      labels:
        app: home-frontend-service-app
    
    spec:
      containers:
        - name: home-frontend-service
          image: 984912521466.dkr.ecr.ap-southeast-1.amazonaws.com/shopflow-home-service-frontend:1.0.0 
          envFrom:
            - configMapRef:
                name: home-frontend-service-config

          imagePullPolicy:  Always

          readinessProbe:
            httpGet:
              path: /home
              port: 5174
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3

          ports:
            - containerPort:  5174
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            
            limits:
              cpu: "80m"
              memory: "100Mi"
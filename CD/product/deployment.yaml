apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-frontend-service
  namespace: dev

spec:
  minReadySeconds: 3
  replicas: 1

  selector:
    matchLabels:
      app: product-frontend-service-app
  
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  
  template:
    metadata:
      name: product-frontend-service-pod
      labels:
        app: product-frontend-service-app
    
    spec:
      containers:
        - name: product-frontend-service
          image:  
          envFrom:
            - configMapRef:
                name: product-frontend-service-config

          imagePullPolicy:  Always

          readinessProbe:
            httpGet:
              path: /product
              port: 5175
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3

          ports:
            - containerPort:  5175
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            
            limits:
              cpu: "80m"
              memory: "100Mi"
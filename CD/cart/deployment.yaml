apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-frontend-service
  namespace: dev

spec:
  minReadySeconds: 3
  replicas: 2

  selector:
    matchLabels:
      app: cart-frontend-service-app
  
  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  
  template:
    metadata:
      name: cart-frontend-service-pod
      labels:
        app: cart-frontend-service-app
    
    spec:
      containers:
        - name: cart-frontend-service
          image:  
          envFrom:
            - configMapRef:
              name: cart-frontend-service-config

          imagePullPolicy:  Always

          readinessProbe:
            httpGet:
              path: /
              ports: 5176

          ports:
            - containerPort:  5176
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            
            limits:
              cpu: "80m"
              memory: "100Mi"
services:
  # Auth-Frontend
  auth-service-frontend:
    image: shopflow-auth-service-frontend:${AUTH_FRONTEND_VERSION}

    build:
      context: ./auth-frontend/frontend
      dockerfile: Dockerfile
      args:
          VITE_AUTH_API_URL: http://13.215.86.33:8000
          
          VITE_HOME_URL: http://18.142.2.14:5174
          VITE_FRONTEND_URL: http://18.142.2.14:5173
    ports:
      - "5173:80"
    networks:
      - shopflow-frontend-network
    restart: always


services:
  # Auth-Frontend
  auth-service-frontend:
    image: shopflow-auth-service-frontend:${AUTH_FRONTEND_VERSION}

    build:
      context: ./auth-frontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: http://56.10.55.153:8000

        VITE_FRONTEND_URL: http://18.142.93.207:5173
        VITE_HOME_URL: http://18.142.93.207:5174
    container_name: auth-frontend
    ports:
      - "5173:80"
    networks:
      - shopflow-frontend-network
    restart: always

  # Home-Frontend
  home-service-frontend:
    image: shopflow-home-service-frontend:${HOME_FRONTEND_VERSION}

    build:
      context: ./home-frontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_HOME_API_URL: http://56.10.55.153:8001
        VITE_PRODUCT_API_URL: http://56.10.55.153:8002
        VITE_PROFILE_API_URL: http://56.10.55.153:8005


        VITE_HOME_FRONTEND_URL: http://18.142.93.207:5174
        VITE_AUTH_FRONTEND_URL: http://18.142.93.207:5173
        VITE_PRODUCT_FRONTEND_URL: http://18.142.93.207:5175
        VITE_CART_FRONTEND_URL: http://18.142.93.207:5176
        VITE_PROFILE_FRONTEND_URL: http://18.142.93.207:5178

    container_name: home-frontend
    ports:
      - "5174:80"
    networks:
      - shopflow-frontend-network
    restart: always

  # Product-Frontend
  product-service-frontend:
    image: shopflow-product-service-frontend:${PRODUCT_FRONTEND_VERSION}

    build:
      context: ./product-frontend/frontend
      dockerfile: Dockerfile
      args:
        # Backend
        VITE_AUTH_API_URL: http://56.10.55.153:8000
        VITE_HOME_API_URL: http://56.10.55.153:8001
        VITE_PRODUCT_API_URL: http://56.10.55.153:8002
        VITE_CART_API_URL: http://56.10.55.153:8003
        VITE_PROFILE_API_URL: http://56.10.55.153:8005

        # Frontend
        VITE_AUTH_FRONTEND_URL: http://18.142.93.207:5173
        VITE_HOME_FRONTEND_URL: http://18.142.93.207:5174
        VITE_PRODUCT_FRONTEND_URL: http://18.142.93.207:5175
        VITE_CART_FRONTEND_URL: http://18.142.93.207:5176
        VITE_PROFILE_FRONTEND_URL: http://18.142.93.207:5178

    container_name: product-frontend
    ports:
      - "5175:80"
    networks:
      - shopflow-frontend-network
    restart: always

  # Cart-Frontend
  cart-service-frontend:    
    image: shopflow-cart-service-frontend:${CART_FRONTEND_VERSION}

    build:
      context: ./cart-frontend/frontend
      dockerfile: Dockerfile
      args:
        # Backend
        VITE_AUTH_API_URL: http://56.10.55.153:8000
        VITE_HOME_API_URL: http://56.10.55.153:8001
        VITE_PRODUCT_API_URL: http://56.10.55.153:8002
        VITE_CART_API_URL: http://56.10.55.153:8003
        VITE_PROFILE_API_URL: http://56.10.55.153:8005


        VITE_PROFILE_API_URL: http://56.10.55.153:8005

        # Frontend
        VITE_AUTH_FRONTEND_URL: http://18.142.93.207:5173
        VITE_HOME_FRONTEND_URL: http://18.142.93.207:5174
        VITE_PRODUCT_FRONTEND_URL: http://18.142.93.207:5175
        VITE_CART_FRONTEND_URL: http://18.142.93.207:5176
        VITE_ORDER_FRONTEND_URL: http://18.142.93.207:5177
        VITE_PROFILE_FRONTEND_URL: http://18.142.93.207:5178

